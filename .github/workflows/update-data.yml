name: Update MAA bond data

on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenBB FINRA provider
        run: |
          pip install --quiet openbb openbb-finra
          python -c "import openbb; openbb.build()"
      - name: Fetch bonds and Treasury curve
        run: python fetch_data.py
      - name: Commit data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
